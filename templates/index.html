<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <nav class="navbar navbar-dark bg-dark shadow">
        <div class="container-fluid">
            <span class="navbar-brand mb-0 h1">📊 SmartRetail: Custom AI Business Analytics</span>
        </div>
    </nav>

    <div class="container mt-5">
        <div class="row">
            <div class="col-md-4">
                <div class="card shadow-sm p-4 mb-4 border-0">
                    <h4 class="card-title text-primary">📥 Upload Data</h4>
                    <p class="text-muted small">Select your business Sales CSV file to begin analysis.</p>
                    <form>
                        <input type="file" class="form-control mb-3" accept=".csv">
                        <button type="submit" class="btn btn-primary w-100 fw-bold">Analyze Data</button>
                    </form>
                </div>
            </div>

            <div class="col-md-8">
                <div class="card shadow-sm p-4 border-0">
                    <h4 class="card-title text-success">📈 Business Performance Indicators</h4>
                    <hr>
                    <p class="text-muted py-5 text-center">Your interactive graphs, revenue metrics, and AI predictions will display here once you choose and upload a data file.</p>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
